<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nightjar</title>
<style>
  /* Nightjar's opening, while the engine starts: the bird breathing over a slow amber glow, the name, and
     what's happening. The same look as on a phone or iPad. Always dark; the app itself follows the theme. */
  :root {
    color-scheme: dark;
    --bg: #141312; --ink: #efe9dd; --ink2: #b3ac9f; --ink3: #7d776d; --rule: rgb(255 255 255 / 0.10);
    --amber: #e0a458; --bad: #f08a72;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    color: var(--ink); background: var(--bg); user-select: none;
    font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  /* Two soft lights that drift very slowly: alive, never busy. */
  .glow { position: fixed; inset: -20%; pointer-events: none; filter: blur(40px); opacity: 0.9; }
  .glow::before, .glow::after { content: ''; position: absolute; border-radius: 50%; }
  .glow::before { width: 46vmax; height: 46vmax; left: 50%; top: 46%; margin: -23vmax 0 0 -23vmax; background: radial-gradient(circle, rgb(224 164 88 / 0.16), transparent 62%); animation: drift1 14s ease-in-out infinite alternate; }
  .glow::after { width: 60vmax; height: 60vmax; left: 30%; top: 70%; margin: -30vmax 0 0 -30vmax; background: radial-gradient(circle, rgb(120 96 160 / 0.10), transparent 60%); animation: drift2 18s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(6vmax, -4vmax) scale(1.08); } }
  @keyframes drift2 { to { transform: translate(14vmax, -8vmax) scale(0.92); } }

  .strip { position: relative; z-index: 2; height: 40px; display: flex; justify-content: flex-end; align-items: center; padding: 0 6px; flex: none; }
  .strip button { width: 38px; height: 34px; border: 0; border-radius: 10px; background: none; color: var(--ink2); display: grid; place-items: center; }
  .strip button:hover { background: rgb(255 255 255 / 0.10); color: var(--ink); }
  .strip button.close:hover { background: #c42b1c; color: #fff; }

  main { position: relative; z-index: 1; flex: 1; display: grid; place-items: center; padding: 0 24px 40px; }
  .stage { width: min(520px, 100%); display: flex; flex-direction: column; align-items: center; text-align: center; }
  .mark svg { width: 64px; height: 64px; display: block; animation: breathe 1.6s ease-in-out infinite; }
  .bird { fill: var(--ink); } .bars { fill: var(--amber); }
  @keyframes breathe { 0%, 100% { opacity: 0.35; scale: 0.94; } 50% { opacity: 1; scale: 1; } }
  @keyframes rise { from { opacity: 0; translate: 0 10px; } }
  h1 { margin: 14px 0 0; font: 600 40px/1 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; letter-spacing: -0.03em; animation: rise 0.6s ease-out both; }

  #loading { margin-top: 18px; min-height: 40px; animation: rise 0.6s 0.15s ease-out both; }
  #status { margin: 0; color: var(--ink3); font-size: 14px; min-height: 21px; transition: opacity 0.3s; }
  .steps { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
  .step { width: 22px; height: 3px; border-radius: 3px; background: var(--rule); overflow: hidden; position: relative; }
  .step.done { background: rgb(224 164 88 / 0.7); }
  .step.now::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--amber), transparent); animation: sweep 1.2s linear infinite; }
  @keyframes sweep { from { translate: -100% 0; } to { translate: 100% 0; } }

  #problem { display: none; width: min(560px, 100%); margin-top: 26px; text-align: left; background: rgb(28 26 24 / 0.9); border: 1px solid var(--rule); border-radius: 20px; padding: 26px 28px; box-shadow: 0 30px 80px -20px rgb(0 0 0 / 0.6); animation: rise 0.4s ease-out both; }
  #problem h2 { margin: 0 0 8px; font-size: 20px; font-weight: 600; color: var(--bad); }
  #problem p { margin: 0 0 16px; color: var(--ink2); }
  pre { margin: 0 0 16px; padding: 12px 14px; border-radius: 12px; background: rgb(0 0 0 / 0.35); color: var(--ink2); font: 11.5px/1.45 "Cascadia Mono", Consolas, monospace; white-space: pre-wrap; max-height: 160px; overflow: auto; user-select: text; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions button { height: 38px; padding: 0 18px; border-radius: 999px; border: 1px solid rgb(255 255 255 / 0.18); background: none; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
  .actions button:hover { background: rgb(255 255 255 / 0.08); }
  .actions button:first-child { background: var(--ink); color: #15131c; border-color: var(--ink); }
  .actions button:first-child:hover { background: #fff; }

  .sig { position: fixed; z-index: 2; left: 0; right: 0; bottom: 26px; text-align: center; font: 12px "Cascadia Mono", Consolas, monospace; color: var(--ink3); opacity: 0.8; }
  .sig::after { content: '_'; animation: caret 1.1s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <div class="strip" id="strip">
    <button onclick="send('minimize')" aria-label="Minimise"><svg width="10" height="10"><path d="M0 5h10" stroke="currentColor"/></svg></button>
    <button class="close" onclick="send('close')" aria-label="Close"><svg width="10" height="10"><path d="M.5.5l9 9M9.5.5l-9 9" stroke="currentColor"/></svg></button>
  </div>

  <main>
    <div class="stage">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 64 64"><path class="bird" d="M32 14.6 C34.6 14.6 36.2 16 36 18.2 C35.9 19.6 35.2 20.6 34.8 21.6 C41 18.6 52 20.4 61.5 28.8 C53 27.6 44 29.4 37.2 34.4 C37 37 36.4 39.4 35.6 41.2 L36.8 53.6 C35.6 55.4 33.8 55.8 32 55.8 C30.2 55.8 28.4 55.4 27.2 53.6 L28.4 41.2 C27.6 39.4 27 37 26.8 34.4 C20 29.4 11 27.6 2.5 28.8 C12 20.4 23 18.6 29.2 21.6 C28.8 20.6 28.1 19.6 28 18.2 C27.8 16 29.4 14.6 32 14.6Z"/><path class="bars" d="M49.6 22.2l3 .8-.5 4.9-3 .7z M14.4 22.2l-3 .8.5 4.9 3 .7z"/></svg>
      </div>
      <h1>Nightjar</h1>

      <div id="loading">
        <p id="status" role="status">Starting Nightjar…</p>
        <div class="steps" aria-hidden="true"><i class="step now" id="s0"></i><i class="step" id="s1"></i><i class="step" id="s2"></i></div>
      </div>

      <div id="problem" role="alert">
        <h2 id="p-title"></h2>
        <p id="p-text"></p>
        <pre id="p-details"></pre>
        <div class="actions" id="p-actions"></div>
      </div>
    </div>
  </main>
  <span class="sig">&gt; coded by lunice</span>

<script>
  function send(action) { try { chrome.webview.postMessage({ type: 'window', action: action }); } catch (e) {} }
  document.getElementById('strip').addEventListener('mousedown', function (e) { if (e.target.closest('button') == null && e.button === 0) send('drag'); });

  // ---- what the app says it's doing, and how far along: three short steps under it.
  function stepOf(text) {
    var t = (text || '').toLowerCase();
    if (t.indexOf('opening') >= 0) return 2;
    if (t.indexOf('engine') >= 0 && t.indexOf('other') < 0) return 1;
    return 0;
  }
  function setStatus(text) {
    document.getElementById('problem').style.display = 'none';
    document.getElementById('loading').style.display = 'block';
    document.getElementById('status').textContent = text === 'Checking…' ? 'Starting Nightjar…' : text;
    var n = stepOf(text);
    for (var i = 0; i < 3; i++) document.getElementById('s' + i).className = 'step' + (i < n ? ' done' : i === n ? ' now' : '');
  }
  function showProblem(p) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('problem').style.display = 'block';
    document.getElementById('p-title').textContent = p.title;
    document.getElementById('p-text').textContent = p.text;
    var d = document.getElementById('p-details');
    d.textContent = p.details || ''; d.style.display = p.details ? 'block' : 'none';
    var a = document.getElementById('p-actions'); a.textContent = '';
    p.actions.forEach(function (x) {
      var b = document.createElement('button'); b.textContent = x.label;
      b.onclick = function () { chrome.webview.postMessage({ type: 'action', id: x.id }); };
      a.appendChild(b);
    });
  }
</script>
</body>
</html>
