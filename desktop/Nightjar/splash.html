<!doctype html>
<html lang="en" data-theme-slot>
<head>
<meta charset="utf-8">
<title>nightjar</title>
<style>
  /* Nightjar's opening, while the engine starts: the bird breathing over a slow amber glow, the name, and
     what's happening. The same look as on a phone or iPad. It follows the theme chosen in the app: the app
     puts it in place of data-theme-slot when it loads this page (none = Auto, which follows Windows). */
  :root {
    color-scheme: dark;
    --bg: #0f111a; --ink: #ece8e0; --ink2: #a9abb8; --ink3: #7a7d8c; --rule: rgb(255 255 255 / 0.10);
    --wash: rgb(255 255 255 / 0.08); --line: rgb(255 255 255 / 0.18); --card: rgb(24 27 40 / 0.9); --well: rgb(0 0 0 / 0.35);
    --on-ink: #151824; --amber: #e8b45a; --bad: #f08a72; --glow: rgb(232 180 90 / 0.16);
  }
  :root[data-theme='light'] {
    color-scheme: light;
    --bg: #e4e1da; --ink: #151824; --ink2: #4a4d5c; --ink3: #6e7180; --rule: rgb(21 24 36 / 0.12);
    --wash: rgb(21 24 36 / 0.06); --line: rgb(21 24 36 / 0.2); --card: rgb(249 248 244 / 0.92); --well: rgb(21 24 36 / 0.05);
    --on-ink: #f2efe9; --bad: #b8402f; --glow: rgb(232 180 90 / 0.28);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) {
      color-scheme: light;
      --bg: #e4e1da; --ink: #151824; --ink2: #4a4d5c; --ink3: #6e7180; --rule: rgb(21 24 36 / 0.12);
      --wash: rgb(21 24 36 / 0.06); --line: rgb(21 24 36 / 0.2); --card: rgb(249 248 244 / 0.92); --well: rgb(21 24 36 / 0.05);
      --on-ink: #f2efe9; --bad: #b8402f; --glow: rgb(232 180 90 / 0.28);
    }
  }
  :root[data-theme='oled'] { --bg: #000; --card: rgb(17 17 16 / 0.95); }
  :root[data-theme='glass'] { --bg: #0c0e12; --ink: #eceff4; --ink2: #a8b0bd; --ink3: #727c8a; --card: rgb(30 34 43 / 0.85); --on-ink: #11141a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    color: var(--ink); background: var(--bg); user-select: none;
    font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  /* Two soft lights that drift very slowly: alive, never busy. */
  .glow { position: fixed; inset: -20%; pointer-events: none; filter: blur(40px); opacity: 0.9; }
  .glow::before, .glow::after { content: ''; position: absolute; border-radius: 50%; }
  .glow::before { width: 46vmax; height: 46vmax; left: 50%; top: 46%; margin: -23vmax 0 0 -23vmax; background: radial-gradient(circle, var(--glow), transparent 62%); animation: drift1 14s ease-in-out infinite alternate; }
  .glow::after { width: 60vmax; height: 60vmax; left: 30%; top: 70%; margin: -30vmax 0 0 -30vmax; background: radial-gradient(circle, rgb(120 96 160 / 0.10), transparent 60%); animation: drift2 18s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(6vmax, -4vmax) scale(1.08); } }
  @keyframes drift2 { to { transform: translate(14vmax, -8vmax) scale(0.92); } }

  .strip { position: relative; z-index: 2; height: 40px; display: flex; justify-content: flex-end; align-items: center; padding: 0 6px; flex: none; }
  .strip button { width: 38px; height: 34px; border: 0; border-radius: 10px; background: none; color: var(--ink2); display: grid; place-items: center; }
  .strip button:hover { background: var(--wash); color: var(--ink); }
  .strip button.close:hover { background: #c42b1c; color: #fff; }

  main { position: relative; z-index: 1; flex: 1; display: grid; place-items: center; padding: 0 24px 40px; }
  .stage { width: min(520px, 100%); display: flex; flex-direction: column; align-items: center; text-align: center; }
  /* The bird's flight: it weaves in, drops the letters of its name, spins, and lands; the moon rises behind it. */
  .nj-stage { width: min(420px, 86vw); height: auto; display: block; overflow: visible; }
  .nj-ink, .nj-word { fill: var(--ink); } .nj-moon, .nj-moonfill { fill: var(--amber); }
  @keyframes rise { from { opacity: 0; translate: 0 10px; } }
  h1 { margin: 0; line-height: 0; }

  /* Leaving for the app: everything fades to the background, then the app fades in. */
  body.leaving main, body.leaving .sig, body.leaving .glow { opacity: 0; transition: opacity 0.3s ease-in; }
  #loading { margin-top: 2px; min-height: 40px; animation: rise 0.6s 2.9s ease-out both; } /* after the bird lands */
  #status { margin: 0; color: var(--ink3); font-size: 14px; min-height: 21px; transition: opacity 0.3s; }
  .steps { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
  .step { width: 22px; height: 3px; border-radius: 3px; background: var(--rule); overflow: hidden; position: relative; }
  .step.done { background: rgb(232 180 90 / 0.7); }
  .step.now::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--amber), transparent); animation: sweep 1.2s linear infinite; }
  @keyframes sweep { from { translate: -100% 0; } to { translate: 100% 0; } }

  #problem { display: none; width: min(560px, 100%); margin-top: 26px; text-align: left; background: var(--card); border: 1px solid var(--rule); border-radius: 20px; padding: 26px 28px; box-shadow: 0 30px 80px -20px rgb(0 0 0 / 0.6); animation: rise 0.4s ease-out both; }
  #problem h2 { margin: 0 0 8px; font-size: 20px; font-weight: 600; color: var(--bad); }
  #problem p { margin: 0 0 16px; color: var(--ink2); }
  pre { margin: 0 0 16px; padding: 12px 14px; border-radius: 12px; background: var(--well); color: var(--ink2); font: 11.5px/1.45 "Cascadia Mono", Consolas, monospace; white-space: pre-wrap; max-height: 160px; overflow: auto; user-select: text; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions button { height: 38px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
  .actions button:hover { background: var(--wash); }
  .actions button:first-child { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .actions button:first-child:hover { opacity: 0.88; }

  .sig { position: fixed; z-index: 2; left: 0; right: 0; bottom: 26px; text-align: center; font: 12px "Cascadia Mono", Consolas, monospace; color: var(--ink3); opacity: 0.8; }
  .sig::after { content: '_'; animation: caret 1.1s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

<script>
  // Reduce Motion (Windows' animation effects off): the finished logo, no flight.
  var intro = document.querySelector('.nj-stage');
  function stillLogo() { try { intro.pauseAnimations(); intro.setCurrentTime(60); } catch (e) {} }
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) stillLogo();
  function send(action) { try { chrome.webview.postMessage({ type: 'window', action: action }); } catch (e) {} }
  document.getElementById('strip').addEventListener('mousedown', function (e) { if (e.target.closest('button') == null && e.button === 0) send('drag'); });

  // ---- what the app says it's doing, and how far along: three short steps under it.
  function stepOf(text) {
    var t = (text || '').toLowerCase();
    if (t.indexOf('opening') >= 0) return 2;
    if (t.indexOf('engine') >= 0 && t.indexOf('other') < 0) return 1;
    return 0;
  }
  function setStatus(text) {
    document.getElementById('problem').style.display = 'none';
    document.getElementById('loading').style.display = 'block';
    document.getElementById('status').textContent = text === 'Checking…' ? 'Starting nightjar…' : text;
    var n = stepOf(text);
    for (var i = 0; i < 3; i++) document.getElementById('s' + i).className = 'step' + (i < n ? ' done' : i === n ? ' now' : '');
  }
  function showProblem(p) {
    stillLogo(); // a problem comes first: the logo stops where it would land
    document.getElementById('loading').style.display = 'none';
    document.getElementById('problem').style.display = 'block';
    document.getElementById('p-title').textContent = p.title;
    document.getElementById('p-text').textContent = p.text;
    var d = document.getElementById('p-details');
    d.textContent = p.details || ''; d.style.display = p.details ? 'block' : 'none';
    var a = document.getElementById('p-actions'); a.textContent = '';
    p.actions.forEach(function (x) {
      var b = document.createElement('button'); b.textContent = x.label;
      b.onclick = function () { chrome.webview.postMessage({ type: 'action', id: x.id }); };
      a.appendChild(b);
    });
  }
</script>
</body>
</html>
