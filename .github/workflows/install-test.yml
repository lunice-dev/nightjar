# Builds the installer exactly as a release does (without signing it) and installs it on a fresh Windows:
# clean install, first start, Tailscale, uninstall, update from 0.7.0, and the built-in updater.
# Publishes nothing. Results are in the run's summary; Nightjar's logs are in the "install-test" artifact.
name: Install test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: install-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: sudo apt-get update && sudo apt-get install -y nsis unzip
      - run: npm ci
      - run: bash installer/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/out/Nightjar-Setup-*.exe
          retention-days: 7

  install:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: installer/out
      - name: Install and check
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer/out/Nightjar-Setup-*.exe | Select-Object -First 1
          ./installer/test/install-test.ps1 -Setup $setup.FullName -Out test-out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-test
          path: test-out
          retention-days: 14
